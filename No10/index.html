function populateSkus(preferred){const list=skuData.filter(x=>x.store===storeSelect.value&&(categorySelect.value==='all'||x.category===categorySelect.value));skuSelect.innerHTML=list.map(x=>`<option value="${x.id}">${x.category} · ${x.name} ${x.variant} / ${x.id}</option>`).join('');if(preferred&&list.some(x=>x.id===preferred))skuSelect.value=preferred}

function drawChart(item){
 const svg=document.getElementById('chart'),W=760,H=350,L=58,R=20,T=20,B=52,plotW=W-L-R,plotH=H-T-B;
 const dateTimes=dates.map(d=>new Date(`${d}T00:00:00`).getTime()),dateSpan=dateTimes[dateTimes.length-1]-dateTimes[0];
 const x=i=>L+plotW*(dateTimes[i]-dateTimes[0])/dateSpan,y=v=>T+plotH*(1-v/100);
 const path=(start,end)=>item.curve.slice(start,end+1).map((v,j)=>`${j===0?'M':'L'} ${x(start+j).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
 let html='';
 [0,25,50,75,100].forEach(v=>{html+=`<line class="gridline" x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}"/><text class="axis-label" x="${L-10}" y="${y(v)+4}" text-anchor="end">${v}%</text>`});
 html+=`<text class="axis-title" transform="translate(17 ${T+plotH/2}) rotate(-90)" text-anchor="middle">消化率</text>`;

 ticks.forEach(i=>{if(i<dates.length){html+=`<text class="axis-label" x="${x(i)}" y="${H-22}" text-anchor="middle">${shortDate(dates[i])}</text>`}});
 const actualIndex=4;
 const seasonEndIndex=13;
 html+=`<line class="today-line" x1="${x(actualIndex)}" y1="${T}" x2="${x(actualIndex)}" y2="${T+plotH}"/><text class="axis-label" x="${x(actualIndex)+5}" y="${T+11}">基準日</text>`;
 html+=`<line class="season-line" x1="${x(seasonEndIndex)}" y1="${T}" x2="${x(seasonEndIndex)}" y2="${T+plotH}"/><text class="season-annotation" x="${x(seasonEndIndex)-5}" y="${T+12}" text-anchor="end">シーズン終了</text>`;
 if(item.markdownDate){const a=new Date('2026-10-14T00:00:00').getTime(),b=new Date('2026-10-21T00:00:00').getTime(),m=new Date(item.markdownDate+'T00:00:00').getTime(),mx=x(5)+(x(6)-x(5))*(m-a)/(b-a);html+=`<line class="markdown-line" x1="${mx}" y1="${T}" x2="${mx}" y2="${T+plotH}"/><text class="annotation" x="${Math.min(mx+5,W-110)}" y="${T+25}">値下げ ${shortDate(item.markdownDate)}</text>`}

 svg.innerHTML=html;

}
