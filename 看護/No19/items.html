<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>評価項目の管理｜看護_No.19</title><link rel="stylesheet" href="style.css?v=20261022-09"><link rel="stylesheet" href="extensions.css?v=20261022-09"><script defer src="data.js?v=20261022-09"></script><script defer src="catalog.js?v=20261022-09"></script><script defer src="store.js?v=20261022-09"></script><script defer src="items.js?v=20261022-09"></script></head><body><header><div class="brand"><span class="logo">＋</span>看護・介護</div><a id="items-back" href="index.html">← 比較・確認へ戻る</a></header><main><div class="title"><div><p class="eyebrow">ASSESSMENT SETTINGS</p><h1>評価項目の管理</h1><p class="lead">管理者向けの項目設定</p></div></div><p class="storage-note">このブラウザ内の設定です。他端末・他の利用者とは共有されません。</p><section class="panel"><div class="sectionhead"><div><h2>登録項目</h2><p class="muted">既存の項目・選択肢は保持し、新しい項目を追加します。</p></div></div><div class="tablewrap"><table class="catalog-table"><thead><tr><th>項目名</th><th>評価の選択肢</th><th>読み取り語句</th><th>適用開始日</th></tr></thead><tbody id="catalog-list"></tbody></table></div></section><section class="panel settings-form"><h2>新しい項目を追加</h2><form id="item-form"><div class="route-grid"><label>項目名<input id="item-name" maxlength="40" required></label><label>適用開始日<input id="item-from" type="date" required><span class="muted">この日以降の評価に表示します。</span></label></div><label>評価の選択肢<textarea id="item-options" rows="3" required placeholder="1行に1つ、2〜8個"></textarea></label><label>記録から拾う語句<textarea id="item-terms" rows="3" required placeholder="1行に1つ、略語やひらがなの表記も登録できます"></textarea></label><p class="muted">項目名や語句からOCRの振り分け候補を出します。候補は人が確認します。照合はモック用の仮ルールです。</p><button type="submit">項目を追加して保存</button><p id="item-message" role="status"></p></form></section></main></body></html>
