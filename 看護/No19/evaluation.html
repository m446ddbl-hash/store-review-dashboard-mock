rt" hidden>確認した内容を取り込む</button><p id="assessment-import-message" role="status"></p></div></details><p id="assessment-message" role="status"></p><button id="assessment-retry" class="secondary" hidden>保存を再試行</button><p class="storage-note">データはこのブラウザ内に保存され、他端末・他の利用者とは共有されません。</p><a id="assessment-return" class="button-link" href="index.html">比較・確認へ戻る</a></main></body></html>
